name: Build and Test Crow API

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libasio-dev libssl-dev

      - name: Configure Crow API
        run: cmake -S crow-api -B crow-api/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Crow API
        run: cmake --build crow-api/build --parallel 2

      - name: Test Crow API
        run: |
          ./crow-api/build/kinetic-loop-crow &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/api/energy/1000
